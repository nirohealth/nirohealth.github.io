<!-- take user to playstore or app store based on user agent -->
<script>
    var params = new URLSearchParams(window.location.search);                                                                                                                                                     
    var src = params.get('utm_source');                                                                                                                                                                             
                                                                                                                                                                                                                      
    if (src === 'nervecream') {
          window.location.href = "https://zanskarhealth.in/pages/p_nerve";
      } else {
          var userAgent = navigator.userAgent || navigator.vendor || window.opera;

          if (/android/i.test(userAgent)) {
              window.location.href = "https://play.google.com/store/apps/details?id=com.nirohealth.niro";
          } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
              window.location.href = "https://apps.apple.com/in/app/zanskar-health-heal-body-pain/id6466461066";
          } else {
              window.location.href = "https://play.google.com/store/apps/details?id=com.nirohealth.niro";
          }
      }
</script>
